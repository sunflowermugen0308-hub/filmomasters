<style>

.card{container-type:inline-size;position:relative;aspect-ratio:2/3;border-radius:10px;overflow:hidden;border:2px solid var(--rc);background:linear-gradient(165deg,hsl(var(--h) 50% 38%),hsl(calc(var(--h) + 50) 55% 10%));color:#fff;box-shadow:0 4px 14px #0006}

.ft{position:absolute;left:0;right:0;bottom:0;padding:14cqi 6cqi 6cqi;display:flex;justify-content:space-between;align-items:flex-end;gap:4cqi;background:linear-gradient(transparent,#000d)}
.ft div{min-width:0}.ft b{display:block;font-size:9cqi;line-height:1.1}.ft small{display:block;font-size:6.5cqi;opacity:.8;margin-top:1cqi}.ft span{font-size:8cqi;font-style:italic;font-weight:400;opacity:.84}
.r0{--rc:#a9b0b9}.r1{--rc:#63cb8b}.r2{--rc:#50a1ff}.r3{--rc:#c17bff}.r4{--rc:#ffc259}.r5{--rc:#ffe48b}.r6{--rc:#ff68c5}
.card{border-color:color-mix(in srgb,var(--rc) 54%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--rc) 22%,transparent),0 5px 16px #0009,inset 0 0 18px color-mix(in srgb,var(--rc) 10%,transparent)}

@keyframes gl{to{box-shadow:0 0 18px 3px #ffd166}}
.gh{background:var(--sf);color:var(--mu);border:2px dashed var(--bd);box-shadow:none}.gh .ft{background:none}.gh .ps{opacity:.25}

@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.85)}}
.nw{position:absolute;top:-6px;left:-6px;background:var(--ac);color:#fff;font-size:.65rem;font-weight:700;padding:2px 6px;border-radius:6px;z-index:2}
.sl{display:flex;gap:6px;align-items:center;justify-content:center;margin:10px 0;flex-wrap:wrap}
.pk{position:relative;width:25px;height:36px;border-radius:6px;border:1px solid #d6b66f;display:block;background:linear-gradient(180deg,#9e2029 0 29%,#f1e2bf 29% 100%);box-shadow:0 2px 4px #0008}

.pk.on{border-color:#e8c26d;background:linear-gradient(180deg,#b52a31 0 29%,#f7ebd0 29% 100%)}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.al,.box{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:12px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.it{display:flex;flex-direction:column;gap:6px}.it .row{font-size:.85rem}
input,select{font:inherit;padding:7px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);max-width:100%}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:99px;opacity:0;transition:.3s;pointer-events:none;z-index:9}
#toast.s{opacity:1}
#toast.coin-toast{display:flex;align-items:center;gap:6px;white-space:nowrap}

body{background:radial-gradient(ellipse 55% 45% at 50% -8%,#ffe5a033,transparent 70%),var(--bg);min-height:100vh}

.pts{display:inline-flex;align-items:center;gap:7px}

.f1{left:50%;width:92px;top:0;transform:translateX(-50%) rotate(-3deg);z-index:3}.f2{left:16px;width:72px;top:24px;transform:rotate(-9deg)}.f3{right:16px;width:72px;top:30px;transform:rotate(9deg)}

.auction-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.wallet-products{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.auction-list{grid-template-columns:repeat(auto-fill,minmax(min(180px,100%),1fr))}
@media(max-width:700px){
 body::before,body::after{width:10px;opacity:.35}
 header{padding:10px 12px 4px;gap:8px}

 .auction-list{grid-template-columns:repeat(2,minmax(0,1fr))}
 .auction-card{padding:9px}
 .auction-card .card{max-width:180px;margin:0 auto}
 .auction-meta{font-size:.9rem}
 .card-dialog-grid,.auction-dialog-grid{grid-template-columns:minmax(0,1fr);gap:12px}
 .card-dialog-grid>div:first-child,.auction-dialog-poster{width:min(48%,180px);margin:0 auto}
 button{white-space:normal}
 .row>*{min-width:0}
 .card-dialog .row button,.auction-dialog .auction-actions button{flex:1}
 .auction-dialog-info{width:100%}
 .card-dialog{padding:16px}
 .auction-dialog{padding:16px}
 .coin-button{padding:5px 8px}
}
@media(max-width:380px){
 header{padding-inline:8px;gap:4px}
 header>span:first-child{gap:6px}
 header>span:last-child{gap:4px}
 header h1{font-size:.92rem;letter-spacing:.02em}
 .brand-icon{width:25px;height:25px}
 #hb{width:32px;height:32px}
 #mb{width:32px;margin-left:0}
 .pts{font-size:.9rem}
 .coin-button{gap:4px;padding:4px 6px;font-size:.86rem}
 .coin-button .currency-icon{width:18px;height:18px}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .card-dialog,.auction-dialog{padding:14px}
}

}

save();
