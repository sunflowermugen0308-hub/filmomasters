[build]
command = "npm run build"
publish = "dist"
functions = "netlify/functions"

[build.environment]
NODE_VERSION = "22"

[functions]
node_bundler = "esbuild"

[[redirects]]
from = "/"
to = "/FilmoMasters.html"
status = 200

[[redirects]]
from = "/api/tmdb/discover"
to = "/.netlify/functions/tmdb-discover"
status = 200
